<!DOCTYPE html>
<header>
    <img src="img/logo-av.png" alt="A&V Drinks Logo" class="logo">
    <p class="tagline">Delivery de bebidas</p>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="carrito-info">
  🛒 Productos: <span id="contador-productos">0</span>
</div>

<section id="contenedor-productos"></section>

<div class="tipo-entrega">
  <h3>Entrega</h3>

  <div class="opciones">
    <button id="btn-retiro" onclick="seleccionarEntrega('retiro')">🏠 Retiro</button>
    <button id="btn-delivery" onclick="seleccionarEntrega('delivery')">🚚 Delivery</button>
  </div>

  <div id="campo-direccion" style="display:none;">
    <button class="btn-ubicacion" onclick="usarUbicacion()">📍 Usar mi ubicación</button>
    <p>o escribir dirección:</p>
    <input type="text" id="direccion" placeholder="Barrio, calle, referencia">
  </div>
</div>

<button id="btn-whatsapp" onclick="enviarPedido()">
  Pedir por WhatsApp
</button>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
